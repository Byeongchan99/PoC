<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Hexagon Dodge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = 960, H = 540;
cvs.width = W;
cvs.height = H;

const TAU = Math.PI * 2;
const CX = W / 2, CY = H / 2;
const N = 6;
const SEG = TAU / N; // 60° per sector
const PRAD = 155;    // player orbit radius

// Sector 1 center = 1.5 * SEG = π/2 → directly below center
const START_SECTOR = 1;

let worldRot = 0;
let rotDir = 1;
let bestTime = 0;
let isNewBest = false;

const keys = new Set();
addEventListener('keydown', e => {
  if (!keys.has(e.code)) {
    keys.add(e.code);
    onKey(e.code);
  }
  if (['ArrowLeft','ArrowRight','Space','ArrowUp','ArrowDown'].includes(e.key))
    e.preventDefault();
});
addEventListener('keyup', e => keys.delete(e.code));

let g;
initGame('start');

function initGame(state) {
  g = {
    state,
    frame: 0,
    rings: [],
    spawnTimer: 0,
    player: {
      sector: START_SECTOR,
      targetSector: START_SECTOR,
      angle: (START_SECTOR + 0.5) * SEG,
    },
  };
  if (state !== 'playing') worldRot = 0;
}

function rotSpeed() { return 0.009 + g.frame * 0.000012; }
function ringSpeed() { return 1.8 + g.frame * 0.038; }
function spawnRate() { return Math.max(36, 90 - g.frame * 0.13); }

function onKey(code) {
  if (g.state === 'start' || g.state === 'dead') {
    isNewBest = false;
    initGame('playing');
    return;
  }
  if (g.state !== 'playing') return;
  if (code === 'ArrowLeft')
    g.player.targetSector = (g.player.targetSector - 1 + N) % N;
  else if (code === 'ArrowRight')
    g.player.targetSector = (g.player.targetSector + 1) % N;
}

function spawnRing() {
  // 1 gap usually; 2 gaps occasionally for relief
  const numGaps = Math.random() < 0.22 ? 2 : 1;
  const order = Array.from({ length: N }, (_, i) => i);
  for (let i = N - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  g.rings.push({ r: 0, gaps: new Set(order.slice(0, numGaps)), done: false });
}

function update() {
  if (g.state === 'start') {
    worldRot += 0.006;
    return;
  }
  if (g.state !== 'playing') return;

  g.frame++;

  // Flip rotation direction every ~10 s
  if (g.frame % 600 === 599) rotDir *= -1;
  worldRot += rotSpeed() * rotDir;

  // Smooth player sector movement
  const target = (g.player.targetSector + 0.5) * SEG;
  let d = target - g.player.angle;
  d = ((d % TAU) + TAU) % TAU;
  if (d > Math.PI) d -= TAU;
  g.player.angle += d * 0.25;

  // Spawn rings
  g.spawnTimer++;
  if (g.spawnTimer >= spawnRate()) {
    spawnRing();
    g.spawnTimer = 0;
  }

  // Expand rings
  const spd = ringSpeed();
  for (const ring of g.rings) ring.r += spd;

  // Collision: when ring circumradius first reaches player orbit
  const pa = ((g.player.angle % TAU) + TAU) % TAU;
  const playerSector = Math.floor(pa / SEG) % N;

  for (const ring of g.rings) {
    if (!ring.done && ring.r >= PRAD) {
      ring.done = true;
      if (!ring.gaps.has(playerSector)) {
        die();
        return;
      }
    }
  }

  g.rings = g.rings.filter(r => r.r < 620);
}

function die() {
  const t = g.frame / 60;
  isNewBest = t > bestTime;
  if (isNewBest) bestTime = t;
  g.state = 'dead';
}

// ── Rendering ────────────────────────────────────────

function hexVerts(r, rot) {
  const v = [];
  for (let i = 0; i < N; i++) {
    const a = i * SEG + rot;
    v.push([CX + r * Math.cos(a), CY + r * Math.sin(a)]);
  }
  return v;
}

function drawTri(x, y, heading, size, color, glowColor) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading);
  if (glowColor) {
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
  }
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.lineTo(size * 0.72, size * 0.56);
  ctx.lineTo(-size * 0.72, size * 0.56);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawScene() {
  ctx.fillStyle = '#272727';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(worldRot);
  ctx.translate(-CX, -CY);

  // Radial guide lines
  const maxR = Math.hypot(W, H) * 0.62;
  ctx.lineWidth = 1;
  for (let i = 0; i < N; i++) {
    const a = i * SEG;
    ctx.strokeStyle = i % 2 === 0
      ? 'rgba(255,255,255,0.16)'
      : 'rgba(255,255,255,0.10)';
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(CX + maxR * Math.cos(a), CY + maxR * Math.sin(a));
    ctx.stroke();
  }

  // Hexagon rings
  ctx.lineWidth = 5;
  for (const ring of g.rings) {
    const alpha = Math.min(1, ring.r / 25);
    ctx.globalAlpha = alpha;
    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#ff1f1f';
    const v = hexVerts(ring.r, 0);
    for (let i = 0; i < N; i++) {
      if (ring.gaps.has(i)) continue;
      ctx.beginPath();
      ctx.moveTo(v[i][0], v[i][1]);
      ctx.lineTo(v[(i + 1) % N][0], v[(i + 1) % N][1]);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Center hexagon accent
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 0;
  const cv = hexVerts(24, 0);
  ctx.beginPath();
  cv.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}

function drawPlayer() {
  if (g.state !== 'playing' && g.state !== 'dead') return;
  const sa = g.player.angle + worldRot;
  const px = CX + PRAD * Math.cos(sa);
  const py = CY + PRAD * Math.sin(sa);
  // heading = sa - π/2 makes the tip point toward center
  const heading = sa - Math.PI / 2;
  const color = g.state === 'dead' ? '#ff6666' : '#ffdd00';
  const glow = g.state === 'dead' ? '#ff4444' : '#ffdd00';
  drawTri(px, py, heading, 12, color, glow);
}

function drawUI() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (g.state === 'playing') {
    const t = (g.frame / 60).toFixed(2);
    ctx.font = 'bold 24px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 5;
    ctx.fillText(t + 's', W / 2, 34);
    ctx.shadowBlur = 0;

    if (bestTime > 0) {
      ctx.font = '13px "Courier New", monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.38)';
      ctx.fillText('BEST  ' + bestTime.toFixed(2) + 's', W / 2, 62);
    }
  }

  if (g.state === 'start') {
    ctx.shadowColor = '#ffdd00';
    ctx.shadowBlur = 28;
    ctx.font = 'bold 52px "Courier New", monospace';
    ctx.fillStyle = '#ffdd00';
    ctx.fillText('HEXAGON', W / 2, H / 2 - 52);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.fillStyle = '#ff2020';
    ctx.fillText('DODGE', W / 2, H / 2 - 2);

    ctx.font = '17px "Courier New", monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('← → 방향키로 육각형 틈을 피하세요', W / 2, H / 2 + 58);
    ctx.fillText('Press any key to start', W / 2, H / 2 + 92);
  }

  if (g.state === 'dead') {
    ctx.fillStyle = 'rgba(0,0,0,0.58)';
    ctx.fillRect(0, 0, W, H);

    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 28;
    ctx.font = 'bold 56px "Courier New", monospace';
    ctx.fillStyle = '#ff3333';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 52);
    ctx.shadowBlur = 0;

    ctx.font = '26px "Courier New", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.fillText((g.frame / 60).toFixed(2) + 's survived', W / 2, H / 2 + 8);

    if (isNewBest) {
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#ffdd00';
      ctx.shadowColor = '#ffdd00';
      ctx.shadowBlur = 10;
      ctx.fillText('★ NEW BEST ★', W / 2, H / 2 + 44);
      ctx.shadowBlur = 0;
    }

    ctx.font = '15px "Courier New", monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('Press any key to restart', W / 2, H / 2 + (isNewBest ? 80 : 52));
  }
}

function loop() {
  update();
  drawScene();
  drawPlayer();
  drawUI();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
